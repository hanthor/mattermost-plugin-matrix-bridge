name: e2e
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -tags=goolm

jobs:
  complement:
    name: Complement end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COMPLEMENT_BASE_IMAGE: ghcr.io/element-hq/synapse/complement-synapse@sha256:1b63e5c885f581d14d6b48a99f1c0835a5011efbbae1da11f067e8bc4db2a862
      # Images are pinned by digest; e2e-moving-tags.yml watches the moving tags.
      # Optional: a Mattermost license enables the Shared Channels code paths.
      E2E_MM_LICENSE: ${{ secrets.MM_LICENSE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Pull images
        run: |
          docker pull "$COMPLEMENT_BASE_IMAGE"
          docker pull mattermost/mattermost-enterprise-edition:12.1.0
          docker pull postgres:16-alpine
          docker pull ghcr.io/dexidp/dex:v2.41.1
          docker pull ghcr.io/element-hq/matrix-authentication-service@sha256:494c67f08ee8344368f4ed336611dea02b26c4e058bf37a212d090d50b612659
          docker pull ghcr.io/element-hq/synapse@sha256:1909bcc07d4180945464712a7f4d4bb6f644c4c1774d026d77cdadc196b91eb8

      - name: Build plugin bundle
        run: make dist

      - name: Run end-to-end suite
        run: make e2e

      - name: Upload Mattermost and homeserver logs on failure
        if: failure()
        run: docker ps -a --format '{{.Names}}' | xargs -r -I{} sh -c 'echo "=== {} ==="; docker logs {} 2>&1 | tail -n 300'

  complement-tuwunel:
    name: Complement end-to-end (Tuwunel)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Pull images
        run: |
          docker pull mattermost/mattermost-enterprise-edition:12.1.0
          docker pull postgres:16-alpine

      - name: Build plugin bundle
        run: make dist

      - name: Run the suite against Tuwunel
        run: make e2e-tuwunel

      - name: Upload Mattermost and homeserver logs on failure
        if: failure()
        run: docker ps -a --format '{{.Names}}' | xargs -r -I{} sh -c 'echo "=== {} ==="; docker logs {} 2>&1 | tail -n 300'

  mattermost-versions:
    name: Mattermost ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest server the plugin declares (plugin.json min_server_version),
          # and the unlicensed Team Edition image with no enterprise code at all.
          - name: 10.7.1 (minimum supported)
            image: mattermost/mattermost-enterprise-edition:10.7.1
          - name: 12.1.0 Team Edition
            image: mattermost/mattermost-team-edition:12.1.0
    env:
      COMPLEMENT_BASE_IMAGE: ghcr.io/element-hq/synapse/complement-synapse@sha256:1b63e5c885f581d14d6b48a99f1c0835a5011efbbae1da11f067e8bc4db2a862
      E2E_MATTERMOST_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Pull images
        run: |
          docker pull "$COMPLEMENT_BASE_IMAGE"
          docker pull "$E2E_MATTERMOST_IMAGE"
          docker pull postgres:16-alpine

      - name: Build plugin bundle
        run: make dist

      - name: Run the core sync tests
        run: make e2e E2E_TEST_FLAGS="-run 'TestMatrixToMattermost|TestMattermostToMatrix|TestMattermostClientView|TestModerationCrossesTheBridge|TestDirectMessagesOptIn'"

      - name: Upload Mattermost and homeserver logs on failure
        if: failure()
        run: docker ps -a --format '{{.Names}}' | xargs -r -I{} sh -c 'echo "=== {} ==="; docker logs {} 2>&1 | tail -n 300'

  mattermost-ui:
    name: Mattermost web client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPLEMENT_BASE_IMAGE: ghcr.io/element-hq/synapse/complement-synapse@sha256:1b63e5c885f581d14d6b48a99f1c0835a5011efbbae1da11f067e8bc4db2a862
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Pull images
        run: |
          docker pull "$COMPLEMENT_BASE_IMAGE"
          docker pull mattermost/mattermost-enterprise-edition:12.1.0
          docker pull postgres:16-alpine

      - name: Install Playwright browsers
        working-directory: e2e/walkthrough
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the browser-level Mattermost tests
        run: make ui-tests

      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-debug
          path: docs/walkthrough-debug/ui/
          if-no-files-found: ignore
