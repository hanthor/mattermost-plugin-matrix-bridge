# Mattermost bridge Application Service registration (local development)
#
# scripts/local-setup.sh fills in the tokens; never commit real tokens.
# In production download this file from System Console > Plugins > Matrix
# bridge instead, which generates it from the configured values.

id: mattermost-bridge

# Where Synapse delivers events: the plugin's appservice endpoint on Mattermost.
url: http://host.docker.internal:8066/plugins/com.mattermost.plugin-matrix-bridge

# Generated in the plugin settings and copied here by scripts/local-setup.sh.
as_token: REPLACE_WITH_AS_TOKEN
hs_token: REPLACE_WITH_HS_TOKEN

# The bridge bot (@_mattermost_bridge:test.local)
sender_localpart: _mattermost_bridge

rate_limited: false

namespaces:
  users:
    # Ghost users representing Mattermost users
    - exclusive: true
      regex: "@_mattermost_.*:test\\.local"
    # Mirror mode only: the bridge owns every account on its dedicated homeserver.
    # Remove this entry when not using mirror mode.
    - exclusive: true
      regex: "@.*:test\\.local"
  aliases:
    - exclusive: true
      regex: "#_mattermost_.*:test\\.local"
    - exclusive: false
      regex: "#mattermost-bridge-.*:test\\.local"
  rooms: []

# Deliver typing and presence to the bridge (spec v1.13 name plus the MSC2409
# name understood by older homeservers).
receive_ephemeral: true
de.sorunome.msc2409.push_ephemeral: true
# End-to-end encryption: the homeserver passes room keys and device changes to the
# bridge (MSC3202) and lets the bridge bot create its own device (MSC4190).
org.matrix.msc3202: true
io.element.msc4190: true
